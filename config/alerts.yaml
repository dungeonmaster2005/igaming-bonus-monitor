# Telegram alerts: one block per operator, then offers listed / no longer listed, then notes.
# Remove a line kind from `include` to switch it off.
include:
  - fields              # a parsed field changed: was → now
  - over_10x            # UK: wagering went above the threshold below
  - offer_ending        # offer_end_date is `offer_ending_days` days away or fewer
  - issue_opened        # the operator's pages started to contradict themselves / became ambiguous
  - issue_closed
  - terms_text          # terms text passages not explained by a changed field
  - offers_listed       # offers that appeared / are no longer listed (block at the end)

max_lines_per_operator: 5         # then "…and N more"
max_lines_offers_block: 5
offer_ending_days: 7
over_10x_multiplier: 10           # UK wagering above this is flagged (sheet column "Over 10x" too)
terms_diff_fragments: 3           # passages shown per operator, then "+N more"
terms_fragment_chars: 160

# Noisy source: terms text changes (beyond what changed fields explain) on this many consecutive
# days -> marked noisy on the status sheet, no more text alerts for it, one notice. Field alerts stay.
noisy_after_days: 3
noisy_clear_after_days: 7         # cleared after this many days without such a change (one notice)

# Fields whose change is reported (all of them are logged on the "changes" sheet anyway).
fields:
  - qualifying_action
  - qualifying_amount
  - min_deposit
  - promo_code
  - reward_type
  - bonus_percent
  - max_bonus
  - free_spins
  - spin_value
  - total_reward_value
  - eligible_games
  - wagering_multiplier
  - wagering_applies_to
  - max_bet
  - max_win
  - claim_days
  - use_days
  - expiry_days
  - offer_end_date
  - product

caption: "B2B market data. 18+. Not an offer to gamble."
